[package]
name = "ssn-core"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "SecureSourceNote shared core: object model, operation envelopes, durable local store, deterministic replay."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Crypto (ROADMAP S3): audited RustCrypto primitives — no hand-rolled crypto.
chacha20poly1305 = "0.10" # XChaCha20-Poly1305 AEAD (192-bit nonce: safe with random nonces)
hkdf = "0.12"             # HKDF-SHA256 key derivation for the key hierarchy
getrandom = "0.2"         # OS CSPRNG for keys and nonces

[dev-dependencies]
tempfile = "3"
