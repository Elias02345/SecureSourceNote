[package]
name = "ssn-cli"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "SecureSourceNote command-line client."

[lib]
name = "ssn_cli"
path = "src/lib.rs"

[[bin]]
name = "ssn"
path = "src/main.rs"

[dependencies]
ssn-core = { path = "../core" }
getrandom = "0.2"
ureq = { version = "2", default-features = false } # blocking HTTP client; no TLS (local relay over http)
serde_json = "1"

[dev-dependencies]
tempfile = "3"
